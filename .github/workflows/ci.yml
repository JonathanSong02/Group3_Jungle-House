name: CI

# Runs the backend tests, then the frontend lint, tests and production build, on every push to any branch and on
# every pull request to main. The two jobs are independent, always run, and have fixed names so they can be made
# "required" in the branch protection settings later. It needs no secrets, no deployment access and no database.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Read-only token. Pull requests from forks get no secrets (this is the plain `pull_request` event).
permissions:
  contents: read

# A newer push to the same branch (or pull request) cancels the older run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # DUMMY value, not a secret: app.py refuses to start without a key of at least 32 characters.
      FLASK_SECRET_KEY: dummy-ci-only-key-not-a-secret-0123456789
      # Do not start the Notion background thread when the tests import app.py.
      NOTION_AUTO_SYNC_ENABLED: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ci.txt

      # Only the packages the tests import (see requirements-ci.txt). Versions come from requirements.txt.
      - name: Install test dependencies
        working-directory: backend
        run: python -m pip install -r requirements-ci.txt -c requirements.txt

      # Same command developers use locally, plus -v (name every test) and -b (show app log noise only for failures).
      - name: Run backend tests
        working-directory: backend/src
        run: python -m unittest discover -s . -p "test_*.py" -v -b

  frontend:
    name: Frontend lint, tests and build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: jungle-house-wiki-ai
    steps:
      - name: Check out the code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jungle-house-wiki-ai/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Fails on lint errors only. The known, accepted warnings are printed but do not fail the job.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: node --test "src/**/*.test.js"

      - name: Production build
        run: npm run build
